<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dpGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f40ff"/>
      <stop offset="42%" stop-color="#aa42ff"/>
      <stop offset="82%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="dpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#aa42ff" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#dpGlow)">
    <!-- Left Code Chevron < -->
    <path d="M 41 19 L 15 50 L 41 81" stroke="url(#dpGrad)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Code Chevron > -->
    <path d="M 59 19 L 85 50 L 59 81" stroke="url(#dpGrad)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Synaptic Pulse Lines -->
    <line x1="31" y1="50" x2="39" y2="50" stroke="url(#dpGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="61" y1="50" x2="69" y2="50" stroke="url(#dpGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Neural Diamond Core -->
    <polygon points="50,37 61,50 50,63 39,50" fill="url(#dpGrad)"/>
    <!-- Center Spark / AI Node -->
    <circle cx="50" cy="50" r="3.2" fill="#ffffff"/>
    <!-- Vertex Energy Accent Points -->
    <circle cx="15" cy="50" r="3.2" fill="#ffffff"/>
    <circle cx="85" cy="50" r="3.2" fill="#ffffff"/>
  </g>
</svg>
